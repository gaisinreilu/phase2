    <header>
<h1>📝Submit Feedback</h1>
</header>
<main>
    <p>We would love to hear what you think about our
     student portal. Share your feedback and suggestions below.</p>
     
     <br>
    
    <form>
        <label for="Name">Name:</label><br>
     <input type="text" id="Name" Name="Name">
     <br><br>
    
     <label for="Email">Email:</label><br>
     <input type="email" id="Email" Name="email">
     <br><br>
     <select id="Feedback" name="Feedback">
        <option>General Feedback</option>
        <option>Website Suggestion</option>
        <option>Course Feedback</option>
        <option>other</option>
     </select>
     <br><br>
     <select id="Rating" name="Rating" required>
        <option value="">Select Your rating</option>
        <option value="excellent">Excellent</option>
        <option value="Good">Good</option>
        <option value="Average">Average</option>
        <option value="Need Improvement">Need Improvement</option>
     </select>
<br><br>
<label for="Comments">Comments:</label><br>
<textarea id="Comments" name="Comments" rows="6" cols="20"></textarea>
<br><br>
<button type="submit">Submit Feedback</button>
<p>Thank you for taking the time to share your feedback!</p>
</form>
</main>
<hr>
